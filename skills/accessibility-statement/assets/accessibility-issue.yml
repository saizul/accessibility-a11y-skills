# GitHub issue form for accessibility barriers.
# Copy to .github/ISSUE_TEMPLATE/accessibility-issue.yml in the website's repository.
name: Accessibility barrier
description: Something on the site is hard or impossible to use with a disability or assistive technology
title: "[a11y] "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. You do not need technical knowledge to report a problem.
        Please do not include personal health information.
  - type: input
    id: page
    attributes:
      label: Page or feature
      description: The address (URL) or the name of the screen
      placeholder: https://www.example.com/checkout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you tried to do and what went wrong
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does it affect you?
      options:
        - I cannot complete the task
        - I can complete it with difficulty
        - It is annoying but I can work around it
    validations:
      required: true
  - type: dropdown
    id: technology
    attributes:
      label: Assistive technology or settings (optional)
      multiple: true
      options:
        - Screen reader (NVDA, JAWS, VoiceOver, TalkBack, Narrator)
        - Screen magnifier or browser zoom
        - Keyboard only
        - Voice control (Dragon, Voice Control, Voice Access)
        - Switch access
        - High contrast or forced colours
        - Captions or transcripts
        - Other
  - type: input
    id: environment
    attributes:
      label: Device and browser (optional)
      placeholder: "Windows 11, Firefox, NVDA"
  - type: dropdown
    id: wcag
    attributes:
      label: WCAG criterion (for the team, optional)
      options:
        - Unknown
        - 1.1.1 Non-text Content
        - 1.3.1 Info and Relationships
        - 1.4.3 Contrast (Minimum)
        - 2.1.1 Keyboard
        - 2.4.7 Focus Visible
        - 3.3.1 Error Identification
        - 4.1.2 Name, Role, Value
        - Other
  - type: checkboxes
    id: contact
    attributes:
      label: Follow-up
      options:
        - label: You may contact me about this report (we use the address on your account)
